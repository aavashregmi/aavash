<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0d12" />
      <stop offset="50%" stop-color="#06070a" />
      <stop offset="100%" stop-color="#020204" />
    </linearGradient>
    <radialGradient id="auraGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="700" rx="32" fill="url(#bgGrad)"/>
  <rect width="598" height="698" x="1" y="1" rx="31" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
  <circle cx="300" cy="300" r="220" fill="url(#auraGlow)"/>
  
  <!-- Architectural Computer Engineering Mesh Geometry -->
  <g stroke="#ffffff" stroke-width="1.2" fill="none" opacity="0.9">
    <polygon points="300,90 490,210 490,450 300,570 110,450 110,210"/>
    <polygon points="300,140 450,235 450,425 300,520 150,425 150,235"/>
    <polygon points="300,190 410,260 410,400 300,470 190,400 190,260"/>
    <line x1="300" y1="90" x2="300" y2="570" stroke-dasharray="6 6"/>
    <line x1="110" y1="210" x2="490" y2="450"/>
    <line x1="110" y1="450" x2="490" y2="210"/>
  </g>
  
  <!-- Core identity orb -->
  <circle cx="300" cy="330" r="38" fill="#040406" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="300" cy="330" r="16" fill="#ffffff" opacity="0.95"/>
  <circle cx="300" cy="330" r="6" fill="#000000"/>
  
  <!-- Subtle typography tag -->
  <text x="300" y="620" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="13" font-weight="700" letter-spacing="4">AAVASH REGMI</text>
  <text x="300" y="645" text-anchor="middle" fill="#a1a1aa" font-family="monospace" font-size="11" letter-spacing="2">Student</text>
</svg>
