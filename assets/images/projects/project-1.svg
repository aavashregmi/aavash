<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="p1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b0f"/>
      <stop offset="100%" stop-color="#040406"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#p1Grad)"/>
  <rect width="798" height="498" x="1" y="1" rx="15" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  
  <!-- RISC-V 5-Stage Pipeline Schematic (IF, ID, EX, MEM, WB) -->
  <g stroke="#ffffff" fill="none" stroke-width="1.2">
    <!-- Stage 1: IF -->
    <rect x="50" y="160" width="110" height="180" rx="8" fill="#14151c" stroke="rgba(255,255,255,0.3)"/>
    <text x="105" y="240" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="16" font-weight="700">IF</text>
    <text x="105" y="270" text-anchor="middle" fill="#a1a1aa" font-family="monospace" font-size="11">FETCH</text>

    <!-- Arrow 1 -->
    <line x1="160" y1="250" x2="190" y2="250" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Stage 2: ID -->
    <rect x="190" y="160" width="110" height="180" rx="8" fill="#14151c" stroke="rgba(255,255,255,0.3)"/>
    <text x="245" y="240" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="16" font-weight="700">ID</text>
    <text x="245" y="270" text-anchor="middle" fill="#a1a1aa" font-family="monospace" font-size="11">DECODE</text>

    <!-- Arrow 2 -->
    <line x1="300" y1="250" x2="330" y2="250" stroke-width="2"/>

    <!-- Stage 3: EX -->
    <rect x="330" y="160" width="110" height="180" rx="8" fill="#1a1b24" stroke="#ffffff" stroke-width="1.8"/>
    <text x="385" y="240" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="16" font-weight="700">EX</text>
    <text x="385" y="270" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11">ALU / EXEC</text>

    <!-- Arrow 3 -->
    <line x1="440" y1="250" x2="470" y2="250" stroke-width="2"/>

    <!-- Stage 4: MEM -->
    <rect x="470" y="160" width="110" height="180" rx="8" fill="#14151c" stroke="rgba(255,255,255,0.3)"/>
    <text x="525" y="240" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="16" font-weight="700">MEM</text>
    <text x="525" y="270" text-anchor="middle" fill="#a1a1aa" font-family="monospace" font-size="11">ACCESS</text>

    <!-- Arrow 4 -->
    <line x1="580" y1="250" x2="610" y2="250" stroke-width="2"/>

    <!-- Stage 5: WB -->
    <rect x="610" y="160" width="110" height="180" rx="8" fill="#14151c" stroke="rgba(255,255,255,0.3)"/>
    <text x="665" y="240" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="16" font-weight="700">WB</text>
    <text x="665" y="270" text-anchor="middle" fill="#a1a1aa" font-family="monospace" font-size="11">WRITEBACK</text>

    <!-- Hazard Forwarding Bus Line -->
    <path d="M 665 160 L 665 100 L 385 100 L 385 160" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="525" y="85" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11" letter-spacing="2">DATA FORWARDING BYPASS UNIT</text>
  </g>
  
  <text x="400" y="440" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="13" letter-spacing="3">RISC-V (RV32I) 5-STAGE PIPELINE SIMULATOR</text>
</svg>
