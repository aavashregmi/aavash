<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="p2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b0f"/>
      <stop offset="100%" stop-color="#040406"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#p2Grad)"/>
  <rect width="798" height="498" x="1" y="1" rx="15" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  
  <!-- Raft Cluster Multi-Node Topology -->
  <g stroke="#ffffff" fill="none" stroke-width="1.2">
    <!-- Heartbeat RPC Network Links -->
    <line x1="400" y1="160" x2="220" y2="300" stroke-dasharray="6 4" stroke="rgba(255,255,255,0.4)"/>
    <line x1="400" y1="160" x2="580" y2="300" stroke-dasharray="6 4" stroke="rgba(255,255,255,0.4)"/>
    <line x1="220" y1="300" x2="310" y2="410" stroke="rgba(255,255,255,0.2)"/>
    <line x1="580" y1="300" x2="490" y2="410" stroke="rgba(255,255,255,0.2)"/>
    <line x1="310" y1="410" x2="490" y2="410" stroke="rgba(255,255,255,0.2)"/>

    <!-- Leader Node -->
    <circle cx="400" cy="160" r="45" fill="#1e202b" stroke="#ffffff" stroke-width="2.5"/>
    <text x="400" y="155" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="14" font-weight="700">NODE 1</text>
    <text x="400" y="175" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11">[LEADER]</text>

    <!-- Follower Nodes -->
    <circle cx="220" cy="300" r="38" fill="#14151c" stroke="rgba(255,255,255,0.4)"/>
    <text x="220" y="295" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="13">NODE 2</text>
    <text x="220" y="315" text-anchor="middle" fill="#a1a1aa" font-family="monospace" font-size="10">FOLLOWER</text>

    <circle cx="580" cy="300" r="38" fill="#14151c" stroke="rgba(255,255,255,0.4)"/>
    <text x="580" y="295" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="13">NODE 3</text>
    <text x="580" y="315" text-anchor="middle" fill="#a1a1aa" font-family="monospace" font-size="10">FOLLOWER</text>

    <circle cx="310" cy="410" r="32" fill="#14151c" stroke="rgba(255,255,255,0.4)"/>
    <text x="310" y="415" text-anchor="middle" fill="#a1a1aa" font-family="monospace" font-size="12">NODE 4</text>

    <circle cx="490" cy="410" r="32" fill="#14151c" stroke="rgba(255,255,255,0.4)"/>
    <text x="490" y="415" text-anchor="middle" fill="#a1a1aa" font-family="monospace" font-size="12">NODE 5</text>
  </g>
  
  <text x="400" y="65" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="13" letter-spacing="3">RAFT DISTRIBUTED CONSENSUS ENGINE</text>
</svg>
