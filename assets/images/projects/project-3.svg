<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="p3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b0f"/>
      <stop offset="100%" stop-color="#040406"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#p3Grad)"/>
  <rect width="798" height="498" x="1" y="1" rx="15" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  
  <!-- 3x3 Sobel Convolution Kernel & Shader Pixel Matrix -->
  <g stroke="#ffffff" fill="none" stroke-width="1.2">
    <!-- Matrix Gx -->
    <rect x="140" y="150" width="220" height="180" rx="8" fill="#14151c" stroke="rgba(255,255,255,0.3)"/>
    <text x="250" y="130" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="12" letter-spacing="2">SOBEL Gx KERNEL</text>
    <text x="180" y="195" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="14">-1</text>
    <text x="250" y="195" text-anchor="middle" fill="#71717a" font-family="monospace" font-size="14">0</text>
    <text x="320" y="195" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="14">+1</text>
    <text x="180" y="245" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="14">-2</text>
    <text x="250" y="245" text-anchor="middle" fill="#71717a" font-family="monospace" font-size="14">0</text>
    <text x="320" y="245" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="14">+2</text>
    <text x="180" y="295" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="14">-1</text>
    <text x="250" y="295" text-anchor="middle" fill="#71717a" font-family="monospace" font-size="14">0</text>
    <text x="320" y="295" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="14">+1</text>

    <!-- Convolution operator -->
    <text x="400" y="245" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="28">⊗</text>

    <!-- GPU Shader Output Matrix -->
    <rect x="440" y="150" width="220" height="180" rx="8" fill="#1a1b24" stroke="#ffffff" stroke-width="1.8"/>
    <text x="550" y="130" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="12" letter-spacing="2">GLSL SHADER OUTPUT</text>
    
    <!-- Wireframe edge gradient -->
    <path d="M 470 280 L 520 180 L 570 240 L 620 170" stroke="#ffffff" stroke-width="2"/>
    <circle cx="520" cy="180" r="4" fill="#ffffff"/>
    <circle cx="570" cy="240" r="4" fill="#ffffff"/>
    <circle cx="620" cy="170" r="4" fill="#ffffff"/>
  </g>
  
  <text x="400" y="420" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="13" letter-spacing="3">REAL-TIME WEBGL COMPUTER VISION ENGINE</text>
</svg>
